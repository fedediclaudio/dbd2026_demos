# Propiedades de conexion a MySQL (se requiere MySQL 8.0 o superior; Hibernate 7 ya no soporta 5.7).
# Spring Boot arma con esto el DataSource (pool de conexiones HikariCP) que luego se le pasa al SessionFactory
# en com.dbd26.demo1.library.config.HibernateConfiguration.
spring.datasource.url=jdbc:mysql://localhost:3306/library_bd
spring.datasource.username=root
spring.datasource.password=root

# El resto de la configuracion de Hibernate (generacion del esquema, mostrar SQL, etc.) esta en codigo,
# en HibernateConfiguration, para que se vea explicitamente como se arma el SessionFactory.
