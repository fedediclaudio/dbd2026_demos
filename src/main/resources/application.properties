# Conexion a MongoDB (se requiere MongoDB 4.4 o superior). Sin usuario ni clave: instancia local de desarrollo.
# Formato con autenticacion: mongodb://usuario:clave@host:27017/base?authSource=admin
# Atencion: hasta Spring Boot 3 esta propiedad se llamaba spring.data.mongodb.uri; en Boot 4 paso a spring.mongodb.uri
# (la conexion ya no se considera parte de Spring Data). Con el nombre viejo se ignora y se usa la base "test".
spring.mongodb.uri=mongodb://localhost:27017/library_bd

# MongoDB no tiene esquema: las colecciones y los campos se crean al insertar el primer documento.
# Lo unico que se "declara" son los indices (@Indexed en las clases); esta propiedad hace que Spring Data los cree
# al arrancar, por ejemplo el indice unico sobre book.isbn.
spring.data.mongodb.auto-index-creation=true

# Mostrar en la consola todas las operaciones que se envian a MongoDB (equivalente al show_sql de Hibernate)
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
