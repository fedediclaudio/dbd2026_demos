# Perfil "h2": permite correr los tests contra una base en memoria, sin necesidad de tener MySQL levantado.
# NON_KEYWORDS=YEAR: la columna "year" de Book es palabra reservada en H2 (no en MySQL 8), esto evita el error de DDL.
# Activar con:  ./mvnw test -Dspring.profiles.active=h2
# Por defecto (sin perfil) los tests corren contra MySQL, igual que la aplicacion.
spring.datasource.url=jdbc:h2:mem:library_bd;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=YEAR
spring.datasource.username=sa
spring.datasource.password=
